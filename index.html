<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferien-App</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.48.0/tabler-icons.min.css" />

  <!-- Suchmaschinen sollen diese private App nicht indexieren -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- MSAL.js für die Microsoft-Anmeldung -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
</head>
<body>

  <div id="login-screen">
    <div class="sun-badge"><i class="ti ti-sun"></i></div>
    <h2>Ferien-App</h2>
    <p>Melde dich mit deinem Microsoft-Konto an, um auf deine Ferien-Listen zuzugreifen.</p>
    <button id="login-button">Mit Microsoft anmelden</button>
  </div>

  <div id="app-screen" class="hidden">
    <header>
      <div class="sun-badge small"><i class="ti ti-sun"></i></div>
      <div class="header-text">
        <p id="header-sub"></p>
        <h1 id="header-title">Ferien-App</h1>
      </div>
      <select id="trip-switcher" class="trip-switcher" title="Ferien wechseln"></select>
      <span id="sync-status"></span>
    </header>
    <div class="body-layout">
      <!-- Seitenleiste: nur ab PC-Breite sichtbar (siehe style.css), gleiche
           Bereiche wie die untere Tab-Leiste, nur als "Verwalten"-Navigation -->
      <nav class="sidebar" id="sidebar-nav">
        <p class="sidebar-title">Verwalten</p>
      </nav>

      <main id="tab-content"></main>
    </div>

    <!-- Untere Tab-Leiste: nur bis Tablet-Breite sichtbar (siehe style.css).
         Inhalt wird per JS aus der (vom Nutzer sortierbaren) Kachel-Reihenfolge
         aufgebaut, siehe renderNavBars() in app.js. -->
    <nav class="tab-bar" id="tab-bar-nav"></nav>
  </div>

  <button id="scroll-top-btn" class="scroll-top-btn" title="Nach oben">
    <i class="ti ti-arrow-up"></i>
  </button>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
